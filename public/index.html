<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peta Retail Pontianak Selatan</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- MarkerCluster -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="app-header">
    <h1>🏪 Peta Minimarket & Swalayan Pontianak Selatan</h1>
    <p>Node.js + Express + Leaflet.js</p>
  </header>

  <div class="app-container">
    <aside class="sidebar">
      <div class="panel">
        <h3>📊 Statistik Merek</h3>
        <div id="stats">Memuat…</div>
      </div>

      <div class="panel">
        <h3>🔍 Filter Merek</h3>
        <label class="toggle">
          <input type="checkbox" class="filter-merek" value="indomaret" checked>
          <span class="dot dot-indomaret"></span><span>Indomaret</span>
        </label>
        <label class="toggle">
          <input type="checkbox" class="filter-merek" value="alfamart" checked>
          <span class="dot dot-alfamart"></span><span>Alfamart</span>
        </label>
        <label class="toggle">
          <input type="checkbox" class="filter-merek" value="lainnya" checked>
          <span class="dot dot-lainnya"></span><span>Lainnya (Swalayan, Minimarket)</span>
        </label>
      </div>

      <div class="panel">
        <h3>🎛 Kontrol Peta</h3>
        <label class="toggle">
          <input type="checkbox" id="toggleCluster">
          <span>Gabungkan titik berdekatan (cluster)</span>
        </label>
      </div>

      <div class="panel">
        <h3>ℹ️ Petunjuk</h3>
        <p class="hint">Arahkan kursor ke titik untuk melihat merek, klik titik untuk detail lengkap.</p>
      </div>
    </aside>

    <main id="map"></main>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
